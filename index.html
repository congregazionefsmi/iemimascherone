
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Istituto FSMI - Preghiere</title>

    <meta name="theme-color" content="#f8f5ef">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.webmanifest">

    <style>
        :root {
            --background: #f8f5ef;
            --surface: #ffffff;
            --text: #39312c;
            --red: #842630;
            --icon-bg: #f8eee9;
            --icon-color: #922d36;
            --border: #e7ddcf;
            --muted: #877b70;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family: Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* MAIN PAGE */

        .page {
            width: min(100% - 28px, 480px);
            margin: 0 auto;
            padding: 24px 0 20px;
        }

        /* HEADER */

        .brand {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 11px;
            margin: 2px 0 24px;
        }

        .logo {
            width: 43px;
            height: 43px;
            object-fit: contain;
        }

        .brand-name {
            margin: 0;
            color: var(--red);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 20px;
            font-weight: 400;
        }

        /* NAVIGATION GRID */

        .navigation-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 11px;
        }

        .navigation-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;

            min-width: 0;
            min-height: 105px;
            padding: 12px 8px;

            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 9px;

            text-align: center;

            box-shadow: 0 2px 5px rgba(71, 50, 28, 0.04);

            transition:
                transform 150ms ease,
                background 150ms ease,
                border-color 150ms ease;

            -webkit-tap-highlight-color: transparent;
        }

        .navigation-icon {
            display: grid;
            place-items: center;

            width: 34px;
            height: 34px;

            border-radius: 9px;
            background: var(--icon-bg);

            color: var(--icon-color);
            font-size: 21px;
            line-height: 1;
        }

        .navigation-title {
            color: var(--text);
            font-family: Georgia, "Times New Roman", serif;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.2;
        }

        /* INTERACTION */

        @media (hover: hover) {
            .navigation-card:hover {
                background: #fffdfa;
                border-color: #d9c6ad;
            }
        }

        .navigation-card:active {
            transform: scale(0.98);
            background: #f5eee5;
        }

        .navigation-card:focus-visible {
            outline: 2px solid #b18a4b;
            outline-offset: 3px;
        }

        /* FOOTER */

        .footer {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            text-align: center;
        }

        .copyright {
            margin: 0 0 6px;
            color: var(--red);
            font-size: 11px;
        }

        .address {
            margin: 0;
            color: var(--muted);
            font-size: 10px;
            line-height: 1.7;
        }

        /* SMALL SCREENS */

        @media (max-width: 350px) {
            .page {
                width: min(100% - 22px, 480px);
            }

            .navigation-grid {
                gap: 8px;
            }

            .navigation-card {
                min-height: 96px;
                padding: 9px 5px;
            }

            .navigation-title {
                font-size: 14px;
            }

            .brand-name {
                font-size: 18px;
            }
        }

        /* ACCESSIBILITY */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
